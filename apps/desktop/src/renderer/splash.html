<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XiabaoAI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #ffffff;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; cursor: default;
    transition: opacity 0.25s ease-out;
  }

  /* ── Glass reflections ── */
  .bg-orb {
    position: fixed; pointer-events: none; border-radius: 50%;
    filter: blur(120px); opacity: 0.25;
  }
  .bg-orb-1 {
    top: -60px; right: -60px; width: 240px; height: 240px;
    background: rgba(16, 185, 129, 0.12);
  }
  .bg-orb-2 {
    bottom: -80px; left: -40px; width: 200px; height: 200px;
    background: rgba(16, 185, 129, 0.08);
  }

  /* ── Layout ── */
  .splash {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; padding: 32px;
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
  }

  /* ── Logo ── */
  .logo-wrap {
    width: 72px; height: 72px; margin-bottom: 24px; flex-shrink: 0;
    animation: logoIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes logoIn {
    0% { opacity: 0; transform: scale(0.88) translateY(6px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* ── Brand ── */
  .brand {
    text-align: center; margin-bottom: 28px; flex-shrink: 0;
    animation: upIn 0.5s 0.12s cubic-bezier(0.16,1,0.3,1) both;
  }
  .brand-name {
    font-size: 22px; font-weight: 700; letter-spacing: -0.3px;
    color: #0f172a; line-height: 1.2;
  }
  .brand-name em {
    font-style: normal;
    background: linear-gradient(135deg, #10b981, #059669);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  @keyframes upIn {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ── Progress ── */
  .progress {
    width: 100%; max-width: 200px; flex-shrink: 0;
    animation: upIn 0.5s 0.24s cubic-bezier(0.16,1,0.3,1) both;
  }
  .progress-track {
    width: 100%; height: 2.5px;
    background: rgba(16, 185, 129, 0.08);
    border-radius: 3px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #10b981, #34d399, #10b981);
    background-size: 200% 100%;
    border-radius: 3px;
    transition: width 0.7s cubic-bezier(0.16,1,0.3,1);
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
</style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<div class="splash">
  <!-- Logo -->
  <svg class="logo-wrap" viewBox="0 0 104 104" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="104" y2="104" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#10b981"/>
        <stop offset="50%" stop-color="#059669"/>
        <stop offset="100%" stop-color="#047857"/>
      </linearGradient>
    </defs>
    <rect x="4" y="4" width="96" height="96" rx="24" fill="url(#g)"/>
    <rect x="4" y="4" width="96" height="96" rx="24" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <!-- inner dark card -->
    <rect x="24" y="24" width="56" height="56" rx="14" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <!-- X mark -->
    <line x1="38" y1="36" x2="66" y2="68" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <line x1="66" y1="36" x2="38" y2="68" stroke="white" stroke-width="5" stroke-linecap="round"/>
  </svg>

  <!-- Brand -->
  <div class="brand">
    <div class="brand-name">Xiabao<em>AI</em></div>
  </div>

  <!-- Progress -->
  <div class="progress">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
</div>

<script>
  var fill = document.getElementById("progressFill");
  var auto = true;
  var timer = setInterval(function () {
    if (!auto) return;
    var w = parseFloat(fill.style.width) || 0;
    if (w >= 85) { clearInterval(timer); }
    else { fill.style.width = Math.min(w + Math.random() * 18 + 6, 85) + "%"; }
  }, 500);

  window.__splashSetProgress = function (pct) {
    if (auto) { auto = false; clearInterval(timer); }
    fill.style.width = Math.min(pct, 100) + "%";
  };
</script>
</body>
</html>
