<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XiabaoAI</title>
<style>
  :root {
    --bg: #0e1012;
    --text-primary: #eaeaec;
    --text-secondary: #8e9094;
    --text-tertiary: #505256;
    --accent: #22c55e;
    --accent-glow: rgba(34,197,94,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; cursor: default;
  }

  /* ── Background ── */
  .bg-layer {
    position: fixed; inset: 0; overflow: hidden; pointer-events: none;
  }
  .bg-glow {
    position: absolute;
    top: 50%; left: 50%;
    width: 640px; height: 640px;
    transform: translate(-50%, -52%);
    background: radial-gradient(circle, rgba(34,197,94,0.025) 0%, transparent 60%);
  }
  .bg-glow-2 {
    position: absolute;
    top: 65%; left: 50%;
    width: 500px; height: 200px;
    transform: translate(-50%, 0);
    background: radial-gradient(ellipse, rgba(34,197,94,0.03) 0%, transparent 70%);
  }
  .bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  /* ── Main Layout ── */
  .splash {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; padding: 60px 48px;
  }

  /* ── Logo ── */
  .logo-wrap {
    width: 104px; height: 104px; margin-bottom: 40px;
    animation: logoIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes logoIn {
    0% { opacity: 0; transform: scale(0.88) translateY(6px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .logo-svg { width: 104px; height: 104px; display: block; }

  /* ── Brand ── */
  .brand-block {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    margin-bottom: 52px;
  }
  .brand-name {
    font-size: 28px; font-weight: 600; letter-spacing: -0.2px;
    color: var(--text-primary); line-height: 1;
    animation: upIn 0.55s 0.1s cubic-bezier(0.16,1,0.3,1) both;
  }
  .brand-name em {
    font-style: normal; color: var(--accent);
  }
  .brand-sub {
    font-size: 13.5px; font-weight: 400; letter-spacing: 1.8px;
    color: var(--text-secondary);
    animation: upIn 0.55s 0.18s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes upIn {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ── Spacer ── */
  .spacer { flex: 1; min-height: 20px; }

  /* ── Progress ── */
  .progress-block {
    width: 100%; max-width: 300px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    animation: upIn 0.55s 0.32s cubic-bezier(0.16,1,0.3,1) both;
  }
  .progress-track {
    width: 100%; height: 2px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), #4ade80, var(--accent));
    background-size: 200% 100%;
    border-radius: 2px;
    transition: width 0.7s cubic-bezier(0.16,1,0.3,1);
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .progress-label {
    color: var(--text-tertiary);
    font-size: 11.5px; font-weight: 400; letter-spacing: 0.5px;
  }

  /* ── Bottom ── */
  .bottom-bar {
    width: 100%; display: flex; justify-content: space-between;
    padding-top: 36px;
    animation: upIn 0.55s 0.46s cubic-bezier(0.16,1,0.3,1) both;
  }
  .bottom-left, .bottom-right {
    color: rgba(255,255,255,0.12); font-size: 10.5px; font-weight: 400;
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>
  <div class="bg-dots"></div>
</div>

<div class="splash">
  <!-- Logo — SVG geometric mark -->
  <div class="logo-wrap">
    <svg class="logo-svg" viewBox="0 0 104 104" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Outer rounded rect with gradient -->
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="104" y2="104" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#22c55e" />
          <stop offset="35%" stop-color="#16a34a" />
          <stop offset="70%" stop-color="#15803d" />
          <stop offset="100%" stop-color="#14532d" />
        </linearGradient>
        <linearGradient id="lgInner" x1="0" y1="0" x2="0" y2="104" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
          <stop offset="100%" stop-color="rgba(255,255,255,0)" />
        </linearGradient>
      </defs>
      <!-- Shadow glow -->
      <rect x="12" y="12" width="80" height="80" rx="22" fill="none" stroke="rgba(34,197,94,0.12)" stroke-width="8" />
      <!-- Main shape -->
      <rect x="2" y="2" width="100" height="100" rx="22" fill="url(#lg)" />
      <!-- Inner highlight -->
      <rect x="2" y="2" width="100" height="48" rx="22" fill="url(#lgInner)" />
      <!-- Hairline border -->
      <rect x="2" y="2" width="100" height="100" rx="22" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <!-- Inner dark rect -->
      <rect x="22" y="22" width="60" height="60" rx="14" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5" />
      <!-- "X" glyph — two sleek strokes -->
      <line x1="36" y1="34" x2="68" y2="70" stroke="white" stroke-width="5.5" stroke-linecap="round" />
      <line x1="68" y1="34" x2="36" y2="70" stroke="white" stroke-width="5.5" stroke-linecap="round" />
      <!-- Gloss dot top-left -->
      <circle cx="16" cy="16" r="4" fill="rgba(255,255,255,0.25)" />
    </svg>
  </div>

  <!-- Brand -->
  <div class="brand-block">
    <div class="brand-name">Xiabao<em>AI</em></div>
    <div class="brand-sub">聚合型 AI 智能客户端</div>
  </div>

  <div class="spacer"></div>

  <!-- Progress -->
  <div class="progress-block">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-label" id="progressLabel">正在启动…</div>
  </div>

  <!-- Bottom -->
  <div class="bottom-bar">
    <span class="bottom-left" id="versionInfo"></span>
    <span class="bottom-right">XiabaoAI</span>
  </div>
</div>

<script>
  var fill = document.getElementById("progressFill");
  var label = document.getElementById("progressLabel");
  var version = document.getElementById("versionInfo");

  var STEPS = [
    { pct: 10, text: "加载核心组件…" },
    { pct: 24, text: "初始化数据引擎…" },
    { pct: 42, text: "连接 AI 服务…" },
    { pct: 60, text: "准备就绪…" },
    { pct: 76, text: "即将完成…" },
  ];

  var step = 0, autoActive = true;
  var interval = setInterval(function () {
    if (!autoActive) return;
    if (step < STEPS.length) {
      fill.style.width = STEPS[step].pct + "%";
      label.textContent = STEPS[step].text;
      step++;
    } else { clearInterval(interval); }
  }, 650);

  window.__splashSetProgress = function (pct, msg) {
    if (autoActive) { autoActive = false; clearInterval(interval); }
    fill.style.width = Math.min(pct, 100) + "%";
    if (msg) label.textContent = msg;
  };

  var params = new URLSearchParams(window.location.search);
  var v = params.get("v") || "";
  version.textContent = v ? "v" + v : "";
</script>
</body>
</html>
